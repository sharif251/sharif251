<svg width="850" height="260" viewBox="0 0 850 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip path to lock the bubbles strictly inside the glass card -->
    <clipPath id="glass-clip">
      <rect x="55" y="30" width="740" height="200" rx="24" />
    </clipPath>
  </defs>

  <style>
    .bg { fill: #001A23; }
    .blob-1 { fill: #8b5cf6; opacity: 0.6; animation: moveBlob1 8s infinite alternate ease-in-out; }
    .blob-2 { fill: #B3EFB2; opacity: 0.6; animation: moveBlob2 10s infinite alternate ease-in-out; }
    .blob-3 { fill: #E8F1F2; opacity: 0.5; animation: moveBlob3 7s infinite alternate ease-in-out; }
    .glass-panel {
      fill: rgba(255, 255, 255, 0.07);
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 1.5;
      rx: 24px;
    }
    .title {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      text-anchor: middle;
    }
    .subtitle {
      font-family: monospace;
      font-size: 15px;
      fill: #38bdf8;
      text-anchor: middle;
    }
    @keyframes moveBlob1 {
      0% { transform: translate(-20px, -15px) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.2); }
    }
    @keyframes moveBlob2 {
      0% { transform: translate(25px, 15px) scale(1.1); }
      100% { transform: translate(-25px, -15px) scale(0.9); }
    }
    @keyframes moveBlob3 {
      0% { transform: translate(15px, -20px) scale(0.9); }
      100% { transform: translate(-20px, 20px) scale(1.1); }
    }
  </style>

  <!-- Background Base -->
  <rect width="850" height="260" rx="16" class="bg" />

  <!-- Clipped Container: Everything inside here is trapped inside the glass -->
  <g clip-path="url(#glass-clip)">
    <!-- Deep background tint for the liquid glass effect -->
    <rect x="55" y="30" width="740" height="200" fill="#1e1b4b" opacity="0.3" />
    
    <!-- Animated Orbs -->
    <circle cx="250" cy="130" r="90" class="blob-1" />
    <circle cx="600" cy="130" r="100" class="blob-2" />
    <circle cx="425" cy="130" r="80" class="blob-3" />
  </g>

  <!-- Glass Border Overlay (Sits on top for the crisp frosted edge) -->
  <rect x="55" y="30" width="740" height="200" class="glass-panel" />

  <!-- Text -->
  <text x="425" y="125" class="title">N Muhammad Sharif</text>
  <text x="425" y="165" class="subtitle">&lt; Computer Science Student &amp; Developer &gt;</text>
</svg>
